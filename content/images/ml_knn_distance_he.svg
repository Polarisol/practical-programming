  <text x="145" y="122" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#d9822b" text-anchor="middle" direction="rtl" unicode-bidi="embed">ההפרש בתכונה הראשונה: 4</text>
  <text x="145" y="144" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#2c6fb0" text-anchor="middle" direction="rtl" unicode-bidi="embed">ההפרש בתכונה השנייה: 3</text>
  <text x="145" y="180" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#2e7d32" text-anchor="middle">√(4² + 3²) = √25 = 5</text>
  <text x="145" y="222" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#4a3a2a" text-anchor="middle" direction="rtl" unicode-bidi="embed">עם יותר תכונות פשוט</text>
  <text x="145" y="242" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#4a3a2a" text-anchor="middle" direction="rtl" unicode-bidi="embed">מוסיפים עוד ריבועים:</text>
  <text x="145" y="272" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#4a3a2a" text-anchor="middle">√(d₁² + d₂² + d₃² + …)</text>
