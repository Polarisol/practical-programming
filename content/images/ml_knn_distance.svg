<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340">
  <rect x="0" y="0" width="640" height="340" rx="18" fill="#f6f3ec"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a3a2a"/></marker></defs>
  <text x="320" y="38" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#4a3a2a" text-anchor="middle">What is "close"? The straight-line distance</text>
  <rect x="20" y="60" width="330" height="260" rx="12" fill="#ffffff" stroke="#d8cfbf" stroke-width="2"/>
  <line x1="70" y1="290" x2="70" y2="86" stroke="#ece5d8" stroke-width="1"/>
