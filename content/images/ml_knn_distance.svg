  <line x1="104" y1="290" x2="104" y2="86" stroke="#ece5d8" stroke-width="1"/>
  <text x="104" y="308" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" fill="#8a7f72" text-anchor="middle">1</text>
  <line x1="138" y1="290" x2="138" y2="86" stroke="#ece5d8" stroke-width="1"/>
  <text x="138" y="308" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" fill="#8a7f72" text-anchor="middle">2</text>
  <line x1="172" y1="290" x2="172" y2="86" stroke="#ece5d8" stroke-width="1"/>
