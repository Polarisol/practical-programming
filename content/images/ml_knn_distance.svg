  <line x1="206" y1="290" x2="206" y2="86" stroke="#ece5d8" stroke-width="1"/>
  <text x="206" y="308" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" fill="#8a7f72" text-anchor="middle">4</text>
  <line x1="240" y1="290" x2="240" y2="86" stroke="#ece5d8" stroke-width="1"/>
  <text x="240" y="308" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" fill="#8a7f72" text-anchor="middle">5</text>
  <line x1="274" y1="290" x2="274" y2="86" stroke="#ece5d8" stroke-width="1"/>
  <text x="274" y="308" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" fill="#8a7f72" text-anchor="middle">6</text>
  <line x1="308" y1="290" x2="308" y2="86" stroke="#ece5d8" stroke-width="1"/>
  <text x="308" y="308" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" fill="#8a7f72" text-anchor="middle">7</text>
  <line x1="70" y1="290" x2="308" y2="290" stroke="#ece5d8" stroke-width="1"/>
  <line x1="70" y1="256" x2="308" y2="256" stroke="#ece5d8" stroke-width="1"/>
  <text x="60" y="260" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" fill="#8a7f72" text-anchor="end">1</text>
  <line x1="70" y1="222" x2="308" y2="222" stroke="#ece5d8" stroke-width="1"/>
  <text x="60" y="226" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" fill="#8a7f72" text-anchor="end">2</text>
  <line x1="70" y1="188" x2="308" y2="188" stroke="#ece5d8" stroke-width="1"/>
  <text x="60" y="192" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" fill="#8a7f72" text-anchor="end">3</text>
  <line x1="70" y1="154" x2="308" y2="154" stroke="#ece5d8" stroke-width="1"/>
  <text x="60" y="158" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" fill="#8a7f72" text-anchor="end">4</text>
  <line x1="70" y1="120" x2="308" y2="120" stroke="#ece5d8" stroke-width="1"/>
  <text x="60" y="124" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" fill="#8a7f72" text-anchor="end">5</text>
  <line x1="70" y1="86" x2="308" y2="86" stroke="#ece5d8" stroke-width="1"/>
  <text x="60" y="90" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" fill="#8a7f72" text-anchor="end">6</text>
  <line x1="138" y1="256" x2="274" y2="256" stroke="#d9822b" stroke-width="3" stroke-dasharray="6 4"/>
  <line x1="274" y1="256" x2="274" y2="154" stroke="#2c6fb0" stroke-width="3" stroke-dasharray="6 4"/>
  <line x1="138" y1="256" x2="274" y2="154" stroke="#2e7d32" stroke-width="4"/>
  <text x="206" y="278" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#d9822b" text-anchor="middle">4</text>
  <text x="290" y="210" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#2c6fb0" text-anchor="middle">3</text>
  <text x="192" y="195" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#2e7d32" text-anchor="middle">5</text>
  <circle cx="138" cy="256" r="7" fill="#4a3a2a"/>
  <text x="126" y="278" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#4a3a2a" text-anchor="middle">A (2, 1)</text>
  <circle cx="274" cy="154" r="7" fill="#4a3a2a"/>
  <text x="270" y="142" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#4a3a2a" text-anchor="middle">B (6, 4)</text>
  <rect x="370" y="60" width="250" height="260" rx="12" fill="#ffffff" stroke="#d8cfbf" stroke-width="2"/>
  <text x="495" y="92" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#4a3a2a" text-anchor="middle">Pythagoras:</text>
  <text x="495" y="122" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#d9822b" text-anchor="middle">difference in feature 1: 4</text>
  <text x="495" y="144" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#2c6fb0" text-anchor="middle">difference in feature 2: 3</text>
  <text x="495" y="180" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#2e7d32" text-anchor="middle">√(4² + 3²) = √25 = 5</text>
  <text x="495" y="222" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#4a3a2a" text-anchor="middle">With more features, just</text>
  <text x="495" y="242" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#4a3a2a" text-anchor="middle">add more squares:</text>
  <text x="495" y="272" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#4a3a2a" text-anchor="middle">√(d₁² + d₂² + d₃² + …)</text>
</svg>
