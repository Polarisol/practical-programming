<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <rect x="0" y="0" width="640" height="400" rx="18" fill="#f6f3ec"/>
  <text x="320.0" y="38" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#4a3a2a" text-anchor="middle">A confusion matrix: four kinds of results</text>
  <text x="320.0" y="106" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#4a3a2a" text-anchor="middle">Model said: positive</text>
  <text x="520.0" y="106" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#4a3a2a" text-anchor="middle">Model said: negative</text>
  <text x="202" y="180.0" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#4a3a2a" text-anchor="end">Actually positive</text>
  <rect x="224" y="124" width="192" height="102" rx="12" fill="#dff0d8" stroke="#2e7d32" stroke-width="2"/>
  <text x="320.0" y="172" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#2e7d32" text-anchor="middle">TP</text>
  <text x="320.0" y="200" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#2e7d32" text-anchor="middle">True Positive: a hit</text>
  <rect x="424" y="124" width="192" height="102" rx="12" fill="#fbe1dc" stroke="#c0392b" stroke-width="2"/>
  <text x="520.0" y="172" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#c0392b" text-anchor="middle">FN</text>
  <text x="520.0" y="200" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#c0392b" text-anchor="middle">False Negative: a miss</text>
  <text x="202" y="290.0" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#4a3a2a" text-anchor="end">Actually negative</text>
  <rect x="224" y="234" width="192" height="102" rx="12" fill="#fbe1dc" stroke="#c0392b" stroke-width="2"/>
  <text x="320.0" y="282" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#c0392b" text-anchor="middle">FP</text>
  <text x="320.0" y="310" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#c0392b" text-anchor="middle">False Positive: false alarm</text>
  <rect x="424" y="234" width="192" height="102" rx="12" fill="#dff0d8" stroke="#2e7d32" stroke-width="2"/>
  <text x="520.0" y="282" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#2e7d32" text-anchor="middle">TN</text>
  <text x="520.0" y="310" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#2e7d32" text-anchor="middle">True Negative: correct no</text>
  <text x="320.0" y="386" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#4a3a2a" text-anchor="middle">Green: the model was right.   Red: the model was wrong</text>
</svg>
