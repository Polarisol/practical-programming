<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <rect x="0" y="0" width="640" height="360" rx="18" fill="#f6f3ec"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a3a2a"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker></defs>
  <text x="320.0" y="38" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#4a3a2a" text-anchor="middle">Reinforcement learning: learn by trial and error</text>
  <rect x="40" y="125" width="200" height="110" rx="14" fill="#fdebd3" stroke="#d9822b" stroke-width="2"/>
  <text x="140.0" y="175" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#d9822b" text-anchor="middle">Agent</text>
  <text x="140.0" y="203" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#d9822b" text-anchor="middle">the learner</text>
  <rect x="400" y="125" width="200" height="110" rx="14" fill="#dceaf7" stroke="#2c6fb0" stroke-width="2"/>
  <text x="500.0" y="175" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#2c6fb0" text-anchor="middle">Environment</text>
  <text x="500.0" y="203" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#2c6fb0" text-anchor="middle">the game, the world</text>
  <path d="M 140.0 125 C 140.0 70, 500.0 70, 500.0 121" fill="none" stroke="#4a3a2a" stroke-width="3" marker-end="url(#ah)"/>
  <text x="320.0" y="74" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#4a3a2a" text-anchor="middle">action</text>
  <path d="M 500.0 235 C 500.0 320, 140.0 320, 140.0 239" fill="none" stroke="#2e7d32" stroke-width="3" marker-end="url(#ahg)"/>
  <text x="320.0" y="262" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#2e7d32" text-anchor="middle">reward (+ or −)</text>
  <text x="320.0" y="283" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#2e7d32" text-anchor="middle">new situation</text>
  <text x="320.0" y="336" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#4a3a2a" text-anchor="middle">The agent repeats this loop many times and learns which actions bring the most reward</text>
</svg>
