<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380">
  <rect x="0" y="0" width="640" height="380" rx="18" fill="#f6f3ec"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a3a2a"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c6fb0"/></marker><marker id="aho" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9822b"/></marker></defs>
  <text x="320" y="38" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#4a3a2a" text-anchor="middle">The scikit-learn workflow</text>
  <rect x="20" y="70" width="135" height="78" rx="12" fill="#dceaf7" stroke="#2c6fb0" stroke-width="2"/>
  <circle cx="38" cy="88" r="11" fill="#2c6fb0"/>
  <text x="38" y="93" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="95.5" y="94" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#2c6fb0" text-anchor="middle">Get the data</text>
  <text x="87.5" y="126" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#4a3a2a" text-anchor="middle">a table: X and y</text>
  <rect x="175" y="70" width="135" height="78" rx="12" fill="#dceaf7" stroke="#2c6fb0" stroke-width="2"/>
  <circle cx="193" cy="88" r="11" fill="#2c6fb0"/>
  <text x="193" y="93" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="250.5" y="94" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#2c6fb0" text-anchor="middle">Split</text>
  <text x="242.5" y="126" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#4a3a2a" text-anchor="middle">train set, test set</text>
  <rect x="330" y="70" width="135" height="78" rx="12" fill="#dceaf7" stroke="#2c6fb0" stroke-width="2"/>
  <circle cx="348" cy="88" r="11" fill="#2c6fb0"/>
  <text x="348" y="93" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="405.5" y="94" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#2c6fb0" text-anchor="middle">Prepare</text>
  <text x="397.5" y="126" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#4a3a2a" text-anchor="middle">clean and scale</text>
  <rect x="485" y="70" width="135" height="78" rx="12" fill="#dceaf7" stroke="#2c6fb0" stroke-width="2"/>
  <circle cx="503" cy="88" r="11" fill="#2c6fb0"/>
  <text x="503" y="93" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <text x="560.5" y="94" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#2c6fb0" text-anchor="middle">Pick a model</text>
  <text x="552.5" y="126" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#4a3a2a" text-anchor="middle">fits the problem</text>
  <rect x="485" y="210" width="135" height="78" rx="12" fill="#fdebd3" stroke="#d9822b" stroke-width="2"/>
  <circle cx="503" cy="228" r="11" fill="#d9822b"/>
  <text x="503" y="233" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
  <text x="560.5" y="234" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#d9822b" text-anchor="middle">Train</text>
  <text x="552.5" y="266" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#4a3a2a" text-anchor="middle">fit on the train set</text>
  <rect x="330" y="210" width="135" height="78" rx="12" fill="#fdebd3" stroke="#d9822b" stroke-width="2"/>
  <circle cx="348" cy="228" r="11" fill="#d9822b"/>
  <text x="348" y="233" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>
  <text x="405.5" y="234" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#d9822b" text-anchor="middle">Evaluate</text>
  <text x="397.5" y="266" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#4a3a2a" text-anchor="middle">score on the test set</text>
  <rect x="175" y="210" width="135" height="78" rx="12" fill="#e3f1e3" stroke="#2e7d32" stroke-width="2"/>
  <circle cx="193" cy="228" r="11" fill="#2e7d32"/>
  <text x="193" y="233" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">7</text>
  <text x="250.5" y="234" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#2e7d32" text-anchor="middle">Use it</text>
  <text x="242.5" y="266" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#4a3a2a" text-anchor="middle">predict new data</text>
  <line x1="157" y1="109" x2="172" y2="109" stroke="#4a3a2a" stroke-width="2.5" marker-end="url(#ah)"/>
  <line x1="312" y1="109" x2="327" y2="109" stroke="#4a3a2a" stroke-width="2.5" marker-end="url(#ah)"/>
  <line x1="467" y1="109" x2="482" y2="109" stroke="#4a3a2a" stroke-width="2.5" marker-end="url(#ah)"/>
  <line x1="552.5" y1="150" x2="552.5" y2="206" stroke="#4a3a2a" stroke-width="2.5" marker-end="url(#ah)"/>
  <line x1="483" y1="249" x2="468" y2="249" stroke="#4a3a2a" stroke-width="2.5" marker-end="url(#ah)"/>
  <line x1="328" y1="249" x2="313" y2="249" stroke="#4a3a2a" stroke-width="2.5" marker-end="url(#ah)"/>
  <line x1="397.5" y1="208" x2="397.5" y2="152" stroke="#d9822b" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#aho)"/>
  <text x="389.5" y="175" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#d9822b" text-anchor="end">not good enough?</text>
  <text x="389.5" y="192" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#d9822b" text-anchor="end">try again</text>
  <text x="320" y="330" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#4a3a2a" text-anchor="middle">Blue: before the model sees anything · Orange: training and testing · Green: the payoff</text>
  <text x="320" y="354" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#4a3a2a" text-anchor="middle">The test set stays hidden until step 6, so the score is honest</text>
</svg>
