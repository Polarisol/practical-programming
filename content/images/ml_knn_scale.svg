<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340">
  <rect x="0" y="0" width="640" height="340" rx="18" fill="#f6f3ec"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a3a2a"/></marker></defs>
  <text x="320" y="38" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#4a3a2a" text-anchor="middle">Why the columns need the same scale</text>
  <text x="320" y="70" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#4a3a2a" text-anchor="middle">Flat A: 3 rooms, 75 m².   Flat B: 4 rooms, 100 m².</text>
  <rect x="20" y="88" width="295" height="232" rx="12" fill="#ffffff" stroke="#d8cfbf" stroke-width="2"/>
  <text x="167.5" y="116" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#4a3a2a" text-anchor="middle">Before scaling</text>
  <text x="167.5" y="142" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#4a3a2a" text-anchor="middle">Differences: 1 room, 25 m²</text>
  <text x="167.5" y="168" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#4a3a2a" text-anchor="middle">Share of the distance:</text>
  <rect x="40.0" y="180" width="0.4" height="30" fill="#fdebd3" stroke="#d9822b" stroke-width="1.5"/>
  <rect x="40.4" y="180" width="254.6" height="30" fill="#dceaf7" stroke="#2c6fb0" stroke-width="1.5"/>
  <text x="167.704" y="200" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#2c6fb0" text-anchor="middle">size 99.8%</text>
  <text x="40" y="230" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#d9822b" text-anchor="start">rooms: only 0.16%</text>
  <text x="167.5" y="256" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#2e7d32" text-anchor="middle">√(1² + 25²) ≈ 25</text>
  <text x="167.5" y="284" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#4a3a2a" text-anchor="middle">The size decides everything,</text>
  <text x="167.5" y="302" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#4a3a2a" text-anchor="middle">the rooms hardly count</text>
  <rect x="325" y="88" width="295" height="232" rx="12" fill="#ffffff" stroke="#d8cfbf" stroke-width="2"/>
  <text x="472.5" y="116" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#4a3a2a" text-anchor="middle">After scaling</text>
  <text x="472.5" y="142" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#4a3a2a" text-anchor="middle">Scaled: rooms 1, size 1</text>
  <text x="472.5" y="168" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#4a3a2a" text-anchor="middle">Share of the distance:</text>
  <rect x="345.0" y="180" width="127.5" height="30" fill="#fdebd3" stroke="#d9822b" stroke-width="1.5"/>
  <rect x="472.5" y="180" width="127.5" height="30" fill="#dceaf7" stroke="#2c6fb0" stroke-width="1.5"/>
  <text x="408.75" y="200" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#d9822b" text-anchor="middle">rooms 50%</text>
  <text x="536.25" y="200" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#2c6fb0" text-anchor="middle">size 50%</text>
  <text x="472.5" y="256" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#2e7d32" text-anchor="middle">√(1² + 1²) ≈ 1.4</text>
  <text x="472.5" y="284" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#4a3a2a" text-anchor="middle">Both columns</text>
  <text x="472.5" y="302" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#4a3a2a" text-anchor="middle">count the same</text>
</svg>
