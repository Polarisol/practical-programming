<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="680" height="300">
  <rect x="0" y="0" width="680" height="300" rx="18" fill="#f6f3ec"/>

  <!-- base -->
  <rect x="30" y="232" width="620" height="18" rx="6" fill="#8a5a33"/>

  <!-- rods -->
  <rect x="134" y="70" width="12" height="164" rx="5" fill="#a87447"/>
  <rect x="334" y="70" width="12" height="164" rx="5" fill="#a87447"/>
  <rect x="534" y="70" width="12" height="164" rx="5" fill="#a87447"/>

  <!-- disks on rod A, largest at the bottom -->
  <rect x="50"  y="204" width="180" height="28" rx="12" fill="#e05a47" stroke="#9c3426" stroke-width="2"/>
  <rect x="68"  y="176" width="144" height="28" rx="12" fill="#f0a23b" stroke="#a8691a" stroke-width="2"/>
  <rect x="86"  y="148" width="108" height="28" rx="12" fill="#5bb36a" stroke="#357a41" stroke-width="2"/>
  <rect x="104" y="120" width="72"  height="28" rx="12" fill="#4f8fd6" stroke="#2c5f9a" stroke-width="2"/>

  <!-- rod labels -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#4a3a2a" text-anchor="middle">
    <text x="140" y="280">A (start)</text>
    <text x="340" y="280">B (helper)</text>
    <text x="540" y="280">C (target)</text>
  </g>

  <!-- goal arrow -->
  <path d="M190 48 Q340 0 490 48" fill="none" stroke="#555" stroke-width="2.5" stroke-dasharray="7 6"/>
  <path d="M478 36 L494 51 L473 54 Z" fill="#555"/>
  <text x="340" y="50" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#555" text-anchor="middle">move all the disks</text>
</svg>
