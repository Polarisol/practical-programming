<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <rect x="0" y="0" width="640" height="360" rx="18" fill="#f6f3ec"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a3a2a"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c6fb0"/></marker><marker id="aho" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9822b"/></marker></defs>
  <text x="320" y="38" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#4a3a2a" text-anchor="middle">Every model works the same way: fit, then predict</text>
  <rect x="20" y="70" width="160" height="80" rx="14" fill="#fdebd3" stroke="#d9822b" stroke-width="2"/>
  <text x="100.0" y="107.0" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#d9822b" text-anchor="middle">Training data</text>
  <text x="100.0" y="127.0" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#d9822b" text-anchor="middle">X and y</text>
  <rect x="20" y="210" width="160" height="80" rx="14" fill="#dceaf7" stroke="#2c6fb0" stroke-width="2"/>
  <text x="100.0" y="247.0" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#2c6fb0" text-anchor="middle">New data</text>
  <text x="100.0" y="267.0" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#2c6fb0" text-anchor="middle">X only</text>
  <rect x="250" y="110" width="140" height="140" rx="16" fill="#ffffff" stroke="#4a3a2a" stroke-width="3"/>
  <text x="320" y="172" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#4a3a2a" text-anchor="middle">Model</text>
  <text x="320" y="194" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#4a3a2a" text-anchor="middle">learned rules</text>
  <rect x="460" y="210" width="160" height="80" rx="14" fill="#e3f1e3" stroke="#2e7d32" stroke-width="2"/>
  <text x="540.0" y="247.0" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#2e7d32" text-anchor="middle">Predictions</text>
  <text x="540.0" y="267.0" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#2e7d32" text-anchor="middle">the answers y</text>
  <path d="M 180 110 C 220 110, 230 140, 248 150" fill="none" stroke="#d9822b" stroke-width="3" marker-end="url(#aho)"/>
  <text x="220" y="98" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#d9822b" text-anchor="middle">fit</text>
  <text x="220" y="80" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#d9822b" text-anchor="middle">1. learn</text>
  <line x1="180" y1="250" x2="246" y2="250" stroke="#2c6fb0" stroke-width="3" marker-end="url(#ahb)"/>
  <line x1="392" y1="250" x2="456" y2="250" stroke="#2e7d32" stroke-width="3" marker-end="url(#ahg)"/>
  <text x="424" y="240" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#2e7d32" text-anchor="middle">predict</text>
  <text x="424" y="218" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#2e7d32" text-anchor="middle">2. answer</text>
  <text x="320" y="336" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#4a3a2a" text-anchor="middle">Swap the model for another one, and the rest of the program stays the same</text>
</svg>
