  <text x="518" y="90" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#2e7d32" text-anchor="middle">A new animal: ?</text>
  <text x="518" y="124" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#4a3a2a" text-anchor="middle">1. Measure the distance</text>
