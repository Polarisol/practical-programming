<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs>
<text x="320.0" y="38" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#4a3a2a" text-anchor="middle" >multiply(4, 3) at full depth: 4 calls are open at the same time</text>
<rect x="40" y="70" width="330" height="64" rx="10" fill="#dbe8f7" stroke="#2c5f9a" stroke-width="2"/>
<text x="54" y="96" font-family="Consolas, Menlo, monospace" font-size="18" font-weight="700" fill="#1f2d3d">multiply(4, 3)</text>
<text x="54" y="120" font-family="Consolas, Menlo, monospace" font-size="16" fill="#3a4a5a">4 + multiply(4, 2)</text>
<text x="358" y="96" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-style="italic" fill="#9a6a1a" text-anchor="end" >waiting...</text>
