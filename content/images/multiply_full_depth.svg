<text x="134" y="284" font-family="Consolas, Menlo, monospace" font-size="18" font-weight="700" fill="#1f2d3d">multiply(4, 1)</text>
<text x="134" y="308" font-family="Consolas, Menlo, monospace" font-size="16" fill="#3a4a5a">4 + multiply(4, 0)</text>
<text x="438" y="284" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-style="italic" fill="#9a6a1a" text-anchor="end" >waiting...</text>
