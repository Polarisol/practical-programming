  <text x="330.0" y="376.0" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#7a6a56" text-anchor="middle">Game</text>
  <text x="30.0" y="72.0" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#7a6a56" text-anchor="start">Goals</text>
  <text x="320.0" y="432.0" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#4a3a2a" text-anchor="middle">Squared distances: 1 + 9 + 0 + 16 + 1 + 4 + 1 + 0 = 32</text>
  <text x="320.0" y="458.0" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#4a3a2a" text-anchor="middle">Variance = 32 / 8 = 4  Standard deviation = √4 = 2</text>
