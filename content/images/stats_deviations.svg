  <text x="370.0" y="227.0" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#b06a10" text-anchor="start">−1</text>
  <circle cx="360.0" cy="234.0" r="9" fill="#4a7fc1" stroke="#ffffff" stroke-width="2"/>
  <text x="360.0" y="352.0" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#4a3a2a" text-anchor="middle">5</text>
